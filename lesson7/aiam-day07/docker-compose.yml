services:
  sandbox:
    build: .
    image: aiam-day07-sandbox
    container_name: aiam-day07
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8086/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
