services:
  observability:
    build: .
    image: aiam-day06-observability
    container_name: aiam-day06
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
