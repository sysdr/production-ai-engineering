services:
  redis:
    image: redis:7-alpine
    container_name: aiam-day03-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  memory:
    build: .
    image: aiam-day03-memory
    container_name: aiam-day03
    ports:
      - "8082:8082"
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
